[build]
  command = "npm run build"
  publish = "dist"

# Endereços antigos e www: tudo para https://tugagames.pt (301 = permanente,
# o Google passa a reputação para o domínio novo).
[[redirects]]
  from = "https://quinaoo.netlify.app/*"
  to = "https://tugagames.pt/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://quinaoo.netlify.app/*"
  to = "https://tugagames.pt/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tugagames.pt/*"
  to = "https://tugagames.pt/:splat"
  status = 301
  force = true

# SPA: qualquer outro caminho abre a app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
